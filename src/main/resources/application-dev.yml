spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
      expiration-ms: 900000 # 15 minutos em hml/prd

  cors:
    allowed-origins: "http://localhost:3000" # Libera estritamente para o React rodando no Node local
    allowed-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    allowed-headers: "Authorization, Content-Type"