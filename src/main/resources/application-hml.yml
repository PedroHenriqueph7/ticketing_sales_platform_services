spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      jdbc:
        batch_size: 100
      order_inserts: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
      expiration-ms: 900000 # 15 minutos em hml/prd

  cors:
    allowed-origins: "http://localhost:3000" # Libera estritamente para o React rodando no Node local
    allowed-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    allowed-headers: "Authorization, Content-Type"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
