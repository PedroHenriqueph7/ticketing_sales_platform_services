server:
  port: 8080
  servlet:
    context-path: /api # Pr�tica de mercado para versionamento (ex: /api/v1/orders)

spring:
  application:
    name: ticketing-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info